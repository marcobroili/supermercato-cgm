<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supermercato CGM · Punti Star</title><link rel="stylesheet" href="style.css"></head><body>
<div id="status" role="status">Connessione a Firebase in corso…</div><main id="login" class="page"><div class="imagewrap"><img src="assets/ingresso.png" alt="Scaffale Star, supermercato vintage"><div class="loginOverlay"><label for="existing">Collega già registrato</label><select id="existing"><option value="">— Seleziona un nominativo —</option></select><label for="newname">Oppure nuovo nome e cognome</label><input id="newname" autocomplete="name" placeholder="Nome Cognome"><button id="enter" disabled>ENTRA ★</button><p>Accesso libero: chiunque può consultare una tessera.</p></div></div></main>
<main id="app" class="page hidden"><div class="boardhead"><button id="back">← Cambia utente</button><span>Tessera di <b id="username"></b> · <b id="total">0</b>/50 punti</span></div><div id="board" class="imagewrap board"><img src="assets/tessera.png" alt="Tabellone Punti Star originale con 50 caselle"><div id="slots" class="slots"></div></div><section class="rating"><h3>QUANTO TI PIACE QUESTA FANTASTICA INIZIATIVA?</h3><p>Lascia il tuo giudizio!</p><div id="ratings"><button data-rate="1">★<small>Poco</small></button><button data-rate="2">★★<small>Così così</small></button><button data-rate="3">★★★<small>Fantastica!</small></button></div><p id="ratingText"></p></section></main>
<div class="modal hidden" id="notes"><div class="dialog"><h3 id="noteTitle">Commento</h3><textarea id="noteText" maxlength="200" placeholder="A cosa si riferisce questo punto?"></textarea><div class="actions"><button id="noteSave">Salva</button><button id="noteCancel">Annulla</button></div></div></div><div class="modal hidden" id="party"><div class="dialog"><div class="spark">✦ ★ ✦ ★ ✦</div><h2 id="partyTitle"></h2><button id="partyClose">EVVIVA!</button></div></div><script type="module" src="app.js"></script></body></html>
